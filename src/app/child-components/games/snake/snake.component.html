<div class="container text-center mt-5">
  <h1>Snake Game</h1>
  <canvas #gameCanvas width="500" height="500" class="border"></canvas>
  <div class="mt-3">
    <button class="btn btn-success me-2" (click)="startGame()">Start</button>
    <button class="btn btn-danger" (click)="resetGame()">Reset</button>
  </div>
  <p class="mt-2">Score: {{ score }}</p>
</div>
